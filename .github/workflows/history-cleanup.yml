name: One-time sensitive history cleanup

on:
  push:
    paths:
      - ".github/workflows/history-cleanup.yml"

permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo

      - name: Rewrite and verify history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          Path("/tmp/replacements.txt").write_text(
              r"regex:https://colab\.research\.google\.com/\S+==>[removed]" + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git filter-repo --force --sensitive-data-removal \
            --path bicycleapp.ipynb \
            --invert-paths \
            --replace-text /tmp/replacements.txt
          if git rev-list --all --objects | grep -F "bicycleapp.ipynb"; then
            echo "Notebook still exists in reachable history."
            exit 1
          fi
          if git log --all -S "[removed] --format="%H" -- README.md | grep .; then
            echo "Colab URL still exists in reachable README history."
            exit 1
          fi
          git rm .github/workflows/history-cleanup.yml
          git commit -m "Finalize sensitive history cleanup"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin master
